[package]
name = "systempulse"
version = "0.1.0"
description = "Retro-styled real-time PC performance monitor."
authors = ["Euphoria911"]
edition = "2024"

[lib]
name = "systempulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
parking_lot = "0.12"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
